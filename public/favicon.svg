<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Roam China Travel — seal-red rounded square with mountain & sun mark (no text, works at 16px) -->
  <rect id="seal" width="128" height="128" rx="24" fill="#c0392b"/>
  <rect id="seal-edge" x="6" y="6" width="116" height="116" rx="19" fill="none" stroke="#fdf6ee" stroke-opacity="0.3" stroke-width="2.5"/>
  <g id="mark" fill="#fdf6ee">
    <circle id="sun" cx="86" cy="40" r="11"/>
    <path id="peaks" d="M20 94 L52 46 L66 68 L80 54 L108 94 Z"/>
  </g>
  <style>
    @media (prefers-color-scheme: dark) {
      #seal { fill: #e8a020; }
      #seal-edge { stroke: #18130e; }
      #mark { fill: #18130e; }
    }
  </style>
</svg>
